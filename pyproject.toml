[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cktn-electra"
version = "1.0.0"
description = "Script-aware calibrated ELECTRA adaptation for Cham, Khmer and Tay-Nung (CKTN)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Anh Trac Duc Dinh" },
  { name = "Khang Nhat Hoang Vo" },
  { name = "Vinh Cong Doan" },
  { name = "Tai Tien Ta" },
  { name = "Khoa Duc Anh Lam" },
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "sentencepiece>=0.2.0",
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Paper = "https://arxiv.org/abs/2607.08362"
Model = "https://huggingface.co/nhatkhangdtp/CKTN-ELECTRA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
